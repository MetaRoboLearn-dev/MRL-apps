services:

  # ── Redis (shared state for multi-worker setup) ───────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # ── Flask backend (gunicorn + gevent) ───────────────────────────────────────
  backend:
    build:
      context: ../server
    restart: unless-stopped
    env_file: .env
    # DATABASE_URL is read directly from .env
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0

  # ── Nginx (HTTPS + static frontend + API/WebSocket proxy) ──────────────────
  nginx:
    build:
      context: ..                                   # project root
      dockerfile: containerisation/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      - backend

volumes:
  redis_data:
  ssl_certs:
