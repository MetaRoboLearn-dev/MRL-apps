# ─────────────────────────────────────────────────────────────────────────────
# DEVELOPMENT ONLY  –  no HTTPS, no nginx, hot-reload friendly
# For the full production stack (nginx + HTTPS + PostgreSQL) use:
#   docker compose -f containerisation/docker-compose.yml up --build
# ─────────────────────────────────────────────────────────────────────────────
services:

  backend:
    build:
      context: ./server
    restart: unless-stopped
    env_file: containerisation/.env
    # DATABASE_URL comes from containerisation/.env
    ports:
      - "5000:5000"
    command: python app.py

  frontend:
    build:
      context: ./gui
    ports:
      - "3000:3000"
    depends_on:
      - backend