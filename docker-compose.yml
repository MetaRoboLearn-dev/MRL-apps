# ─────────────────────────────────────────────────────────────────────────────
# DEVELOPMENT ONLY  –  no HTTPS, no nginx, hot-reload friendly
# For the full production stack (nginx + HTTPS + PostgreSQL) use:
#   docker compose -f containerisation/docker-compose.yml up --build
# ─────────────────────────────────────────────────────────────────────────────
services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-mrl}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mrl}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    restart: unless-stopped
    env_file: containerisation/.env
    # DATABASE_URL comes from containerisation/.env
    ports:
      - "8000:8000"
    command: python app.py

  frontend:
    build:
      context: ./gui
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: